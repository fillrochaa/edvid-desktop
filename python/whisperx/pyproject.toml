[project]
name = "edvid-whisperx-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "whisperx==3.8.6",
  # Tracking de rosto da Fase 2 (helpers/face_track.py). Preso na linha 4.x:
  # o OpenCV 5 removeu CascadeClassifier e os cascades Haar, que sao a base do
  # detector usado. "headless" evita as dependencias de GUI.
  "opencv-python-headless>=4.10,<5",
]

[tool.uv]
required-version = "==0.12.3"
exclude-newer = "2026-08-15T00:00:00Z"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
