# Smoke do runtime pack win32 PUBLICADO: baixa do R2 o mesmo tar.gz que o
# aplicativo do aluno baixa, extrai com o mesmo bsdtar e roda os mesmos
# comandos que o Edvid/agente rodam (node, ffmpeg, python3 -m whisperx e o
# smoke de decodificacao de audio). Reproduz o ambiente do aluno sem GUI.
name: windows-smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Baixar e extrair o runtime pack publicado
        run: |
          $key = node -e "const m=require('./resources/runtime-manifest.json');const{createHash}=require('crypto');console.log(createHash('sha256').update(JSON.stringify(m.runtimes)).digest('hex').slice(0,12))"
          $pack = "runtimes-win32-x64-$key.tar.gz"
          $url = "https://pub-89ee05cdaf26477c8984a36be2b373fa.r2.dev/runtimes/$pack"
          Write-Host "Pacote: $url"
          curl.exe -fsSL -o $pack $url
          if ($LASTEXITCODE -ne 0) { throw "download falhou" }
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          tar -xzf $pack -C tools
          if ($LASTEXITCODE -ne 0) { throw "extracao falhou" }
          Get-ChildItem tools/win32-x64

      - name: Ferramentas básicas do pack
        run: |
          $root = "tools/win32-x64"
          & "$root/node/node.exe" --version
          & "$root/ffmpeg/bin/ffmpeg.exe" -version | Select-Object -First 1
          & "$root/ffmpeg/bin/ffprobe.exe" -version | Select-Object -First 1
          & "$root/uv/bin/uv.exe" --version
          & "$root/yt-dlp/bin/yt-dlp.exe" --version
          & "$root/codex-app-server/bin/codex-app-server.exe" --version

      - name: Python e alias python3 do pack
        run: |
          $py = "tools/win32-x64/python-whisperx/python"
          & "$py/python.exe" --version
          if (-not (Test-Path "$py/python3.exe")) { throw "python3.exe ausente no pack" }
          & "$py/python3.exe" --version
          # O runner tem o VC++ Redistributable e mascararia a ausencia; a
          # maquina do aluno nao tem — as DLLs precisam estar NO pack.
          foreach ($dll in @('msvcp140.dll', 'vcomp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "$py/$dll")) { throw "runtime VC++ app-local ausente no pack: $dll" }
          }

      - name: Imports do WhisperX (torch, torchcodec, DLLs)
        run: |
          $py = "tools/win32-x64/python-whisperx/python/python3.exe"
          & $py -B -c "from importlib.metadata import version; import ctranslate2, faster_whisper, pyannote.audio, torch, torchcodec, whisperx; print('whisperx', version('whisperx')); print('torch', torch.__version__)"
          if ($LASTEXITCODE -ne 0) { throw "imports falharam" }

      # Daqui em diante o ambiente espelha o agentToolsEnvironment do app:
      # PATH com o python e o ffmpeg do pack, caches HF locais.
      - name: Smoke de áudio (mesmo caminho do corte)
        run: |
          $env:PATH = (Resolve-Path "tools/win32-x64/python-whisperx/python").Path + ";" + (Resolve-Path "tools/win32-x64/ffmpeg/bin").Path + ";" + $env:PATH
          ffmpeg -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 0.25 tone.wav
          $tone = (Resolve-Path tone.wav).Path -replace '\\','/'
          python3 -B -c "from whisperx.audio import load_audio; print('amostras:', load_audio('$tone').shape[0])"
          if ($LASTEXITCODE -ne 0) { throw "smoke de audio falhou" }

      - name: Prefetch dos modelos (como o app faz no boot)
        run: |
          $env:PATH = (Resolve-Path "tools/win32-x64/python-whisperx/python").Path + ";" + $env:PATH
          $env:HF_HOME = "$PWD/hf-cache"
          $env:HUGGINGFACE_HUB_CACHE = "$PWD/hf-cache/hub"
          $env:HF_HUB_DISABLE_TELEMETRY = "1"
          # Transcricao + alinhamento pt, os dois que o ensureWhisperModel baixa,
          # com os MESMOS filtros do app (so os pesos PyTorch do alinhamento).
          # O smoke antigo pulava o alinhamento (--no_align) e ficou verde
          # enquanto o aluno morria em "modelo de alinhamento nao disponivel".
          python3 -B -c "from huggingface_hub import snapshot_download; snapshot_download('Systran/faster-whisper-small'); snapshot_download('jonatasgrosman/wav2vec2-large-xlsr-53-portuguese', allow_patterns=['*.json', '*.txt', 'pytorch_model.bin', 'preprocessor_config.json'], ignore_patterns=['language_model/*'])"
          if ($LASTEXITCODE -ne 0) { throw "prefetch dos modelos falhou" }
          # O filtro tem de valer: o flax nao pode estar no cache e os pesos sim.
          $align = Get-ChildItem -Recurse -Path "hf-cache/hub/models--jonatasgrosman--wav2vec2-large-xlsr-53-portuguese/snapshots" -File -Force
          if ($align.Name -contains 'flax_model.msgpack') { throw "flax_model.msgpack baixado a toa" }
          $pesos = $align | Where-Object { $_.Name -eq 'pytorch_model.bin' }
          if (-not $pesos) { throw "pytorch_model.bin ausente no cache" }

      - name: Transcrição real pela CLI com alinhamento, offline (como o agente)
        run: |
          $env:PATH = (Resolve-Path "tools/win32-x64/python-whisperx/python").Path + ";" + (Resolve-Path "tools/win32-x64/ffmpeg/bin").Path + ";" + $env:PATH
          $env:HF_HOME = "$PWD/hf-cache"
          $env:HUGGINGFACE_HUB_CACHE = "$PWD/hf-cache/hub"
          $env:TORCH_HOME = "$PWD/torch-cache"
          $env:XDG_CACHE_HOME = "$PWD/xdg-cache"
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:PYTHONNOUSERSITE = "1"
          $env:HF_HUB_OFFLINE = "1"
          # Fala de verdade (SAPI): sem palavras o alinhamento nao e exercitado.
          Add-Type -AssemblyName System.Speech
          $tts = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $tts.SetOutputToWaveFile("$PWD/fala.wav")
          $tts.Speak('O Edvid corta o video guiado pelo audio da fala.')
          $tts.Dispose()
          python3 -B -m whisperx fala.wav --model small --language pt --device cpu --compute_type int8 --output_dir saida --output_format json
          if ($LASTEXITCODE -ne 0) { throw "whisperx CLI com alinhamento falhou" }
          $json = Get-Content saida/fala.json -Raw | ConvertFrom-Json
          if (-not $json.segments -or $json.segments.Count -lt 1) { throw "transcricao sem segmentos" }
          $words = @($json.segments | ForEach-Object { $_.words } | Where-Object { $_ -and $null -ne $_.start })
          if ($words.Count -lt 1) { throw "alinhamento nao gerou tempos de palavra" }
          Write-Host "segmentos: $($json.segments.Count); palavras alinhadas: $($words.Count)"
